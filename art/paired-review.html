<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Paired fighter motion review</title><style>
*{box-sizing:border-box}body{margin:10px;background:#111b2a;color:#edf2ff;font:13px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}label{display:inline-grid;gap:2px;font-size:11px}select,button,input{font:12px system-ui;color:#fff;background:#25374e;border:1px solid #68819d;padding:5px}#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.card{min-width:0;background:#223044;border:1px solid #536c89}h2{font-size:14px;margin:5px 8px}.card canvas{width:100%;display:block;image-rendering:pixelated}.meta{font:11px ui-monospace,monospace;margin:4px 8px;white-space:pre-wrap}#status{margin:6px 0}a{color:#aad7ff}</style></head><body>
<header><h1>Paired motion review</h1><label>Group<select id="group"></select></label><label>Scenario<select id="action"></select></label><label>Facing<select id="face"><option value="1">Right</option><option value="-1">Left</option></select></label><label>Position<select id="edge"><option>center</option><option>left wall</option><option>right wall</option></select></label><label>Speed<select id="speed"><option value="1">1×</option><option value=".5">½×</option><option value=".25">¼×</option></select></label><button id="play">Play</button><button id="reset">Restart</button><label>Frames<input id="frames" type="number" value="12" min="1" max="360" style="width:60px"></label><button id="advance">Advance</button></header>
<p id="status" role="status"></p><div id="grid"></div><p>Fixed 60 Hz combat simulation; complete-body rendering and actual throw contacts. Inspection tools do not award visual approval. <a href="/">Play game</a> · <a href="/art/pose-atlas-lab.html">Individual close-up</a></p><script type="module" src="/src/pairedReview.ts"></script></body></html>

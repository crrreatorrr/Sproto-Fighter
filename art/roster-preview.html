<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Sproto Arena — complete sprite roster</title><style>body{background:#121822;color:#eee6cd;font:14px system-ui;margin:30px}a{color:#ffd078}#grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px}.card{background:#222a36;padding:12px;border:1px solid #526071}canvas{image-rendering:pixelated;max-width:100%}.portrait{width:80px}.idle{width:160px}h2{font-size:18px}a{display:inline-block;margin:4px}h1{margin-bottom:10px}.sheet{display:none}</style></head><body><a href="/">Play Sproto Arena →</a><h1>Sproto Arena · Complete roster</h1><p>All 21 reference-based portraits and fighting sprites. Shared movement and combat timing. Select a download link for transparent PNGs.</p><div id="grid"></div><script type="module">
import{drawVampSheet}from'/src/vampArt.ts';import{drawAlpha777Sheet}from'/src/alpha777Art.ts';import{drawMandelaSheet}from'/src/mandelaArt.ts';
import{drawBigSwoleSheet}from'/src/bigSwoleArt.ts';import{drawNateSheet}from'/src/nateArt.ts';
import{PLAYABLE_FIGHTERS,ROSTER,createState,FLOOR}from'/src/core.ts';import{drawSprite,drawPortrait}from'/src/spriteRoster.ts';import{drawRosterASheet}from'/src/rosterArtA.ts';import{drawRosterBSheet}from'/src/rosterArtB.ts';import{drawRosterCSheet}from'/src/rosterArtC.ts';
for(const id of PLAYABLE_FIGHTERS){const div=document.createElement('section');div.className='card';div.innerHTML=`<h2>${ROSTER[id].name}</h2><canvas class="portrait" id="${id}-portrait" width="192" height="224"></canvas><canvas class="idle" id="${id}-idle" width="384" height="260"></canvas><p id="${id}-links"></p>`;document.querySelector('#grid').append(div);const portrait=div.querySelector('.portrait'),idle=div.querySelector('.idle');drawPortrait(portrait.getContext('2d'),id,192,224);const f=createState(id).fighters[0];f.x=135;f.y=FLOOR;const ic=idle.getContext('2d');ic.save();ic.translate(0,225-FLOOR);drawSprite(ic,f,0);ic.restore();let assets=['portrait','idle'];if(id.startsWith('guest')||['crapto','vamp','alpha777','mandela','bigswole','nate'].includes(id)){const sheet=document.createElement('canvas');sheet.className='sheet';sheet.id=id+'-sheet';let draw,w,h;if(id==='bigswole'){draw=(c)=>drawBigSwoleSheet(c);w=1152;h=2400;}else if(id==='nate'){draw=(c)=>drawNateSheet(c);w=896;h=3840;}else if(id==='vamp'){draw=(c)=>drawVampSheet(c);w=1152;h=2400;}else if(id==='alpha777'){draw=(c)=>drawAlpha777Sheet(c);w=896;h=3840;}else if(id==='mandela'){draw=(c)=>drawMandelaSheet(c);w=1152;h=2400;}else if(['guest07','guest08','guest09'].includes(id)){draw=drawRosterASheet;w=1152;h=2400;}else if(['guest10','guest11','guest12'].includes(id)){draw=drawRosterBSheet;w=896;h=3840;}else{draw=drawRosterCSheet;w=832;h=3600;}sheet.width=w;sheet.height=h;div.append(sheet);draw(sheet.getContext('2d'),id);assets.push('sheet');}for(const asset of assets){const a=document.createElement('a');a.id='export-'+id+'-'+asset;a.textContent=asset+' PNG';a.download=id+'-'+asset+'.png';a.href=document.querySelector('#'+id+'-'+asset).toDataURL('image/png');div.querySelector('p').append(a);}}
</script></body></html>

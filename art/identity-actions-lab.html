<!doctype html><html lang="en"><meta charset="utf-8"><title>Individual character action QA</title><style>body{margin:16px;background:#101925;color:white;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{padding:8px;background:#273b53;color:white;border:1px solid #6a82a0}input{width:60px}canvas{width:100%;max-width:1280px;image-rendering:pixelated}pre{white-space:pre-wrap}</style>
<header><b>Individual character action QA</b><label>Fighter <select id="fighter"></select></label><label>Action <select id="action"><option value="entrance">Entrance</option><option value="death">Defeat</option><option value="ranged">Ranged attack</option></select></label><label>Facing <select id="facing"><option value="1">Right</option><option value="-1">Left</option></select></label><button id="reset">Reset</button><button id="play">Play</button><input id="frames" type="number" value="20"><button id="advance">Advance frames</button></header><p id="status">Loading…</p><canvas id="arena" width="1280" height="720" aria-label="Character action preview using the actual game renderer"></canvas><pre id="debug"></pre>
<script type="module">
import{A,ROSTER,PLAYABLE_FIGHTERS,createState,step}from'/src/core.ts';
import{ensurePoseAtlases,getPoseAtlasDebug,getPoseAtlasClipInventory}from'/src/poseAtlas.ts';
import{loadStageArt,setStage}from'/src/stage.ts';import{ensurePowerArt}from'/src/powerArt.ts';import{render}from'/src/render.ts';
const $=id=>document.getElementById(id),c=$('arena').getContext('2d');for(const id of PLAYABLE_FIGHTERS){const o=document.createElement('option');o.value=id;o.textContent=ROSTER[id].name;$('fighter').append(o);}let s,age=0,ready=false,playing=false,last=0,acc=0;
function reset(){playing=false;$('play').textContent='Play';age=0;s=createState($('fighter').value,'dummy','rivet');const face=Number($('facing').value);s.fighters[0].x=face===1?420:860;s.fighters[1].x=face===1?1020:260;s.fighters[0].facing=face;s.fighters[1].facing=-face;draw();}
function draw(){if(!ready)return;const action=$('action').value,p=action==='ranged'?undefined:{phase:action==='entrance'?'intro':age<96?'outro':'result',frame:age,winner:action==='death'?1:null,fromFloor:false};render(c,s,p);$('debug').textContent=JSON.stringify({age,action,playback:getPoseAtlasDebug(s.fighters[0],s.frame),clips:getPoseAtlasClipInventory()[s.fighters[0].id]},null,2);}
function advance(){if(!ready)return;if($('action').value==='ranged')step(s,[age===0?A.bolt:0,0]);age++;draw();}
async function load(){ready=false;playing=false;$('status').textContent='Loading selected fighter and partner…';try{await ensurePoseAtlases([$('fighter').value,'rivet']);ready=true;$('status').textContent='Ready · actual combat renderer · inspect authored clip inventory below';reset();}catch(e){$('status').textContent=e.message;}}
$('fighter').onchange=load;$('action').onchange=reset;$('facing').onchange=reset;$('reset').onclick=reset;$('advance').onclick=()=>{playing=false;$('play').textContent='Play';for(let n=0;n<Number($('frames').value);n++)advance();};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';last=0;acc=0;};function loop(t){if(playing&&ready){if(last)acc+=Math.min(60,t-last);while(acc>=1000/60){advance();acc-=1000/60;if(age>=110){reset();playing=true;$('play').textContent='Pause';}}last=t;}requestAnimationFrame(loop);}requestAnimationFrame(loop);setStage('ranch');void loadStageArt().then(draw);await ensurePowerArt();await load();
</script></html>

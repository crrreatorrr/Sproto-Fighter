<!doctype html><html><head><meta charset="utf-8"><title>Higgsfield articulated rig preview</title><style>body{margin:0;background:#141923;color:#dde6f1;font:14px system-ui}header{padding:18px;display:flex;gap:12px;align-items:center}select,button{padding:8px;background:#283346;color:#fff;border:1px solid #52617b}canvas{display:block;max-width:100%;image-rendering:pixelated}#status{padding:0 18px;color:#aab8cd}</style></head><body><header><strong>Source-derived articulated rigs</strong><select id="pose"><option>idle</option><option>walk</option><option>jump</option><option>crouch</option><option>light</option><option>medium</option><option>heavy</option><option>launcher</option><option>bolt</option><option>grab</option><option>special</option><option>block</option></select><select id="aim"><option>level</option><option>up</option><option>upForward</option><option>down</option></select><button id="pause">Pause</button></header><p id="status">Loading segmented Higgsfield parts…</p><canvas id="view" width="1000" height="500"></canvas><script type="module">import{createState,getMove,A,FLOOR}from'/src/core.ts';import{loadHiggsfieldRigs,drawHiggsfieldFighter,loadedHiggsfieldRigIds}from'/src/higgsfieldRig.ts';await loadHiggsfieldRigs();document.querySelector('#status').textContent=loadedHiggsfieldRigIds().length+' rigs loaded. Heads, torsos and all limb segments retain generated source pixels. Ground line marks planted feet.';const c=document.querySelector('#view').getContext('2d');const fighters=['rivet','vela'].map(id=>createState(id,'dummy').fighters[0]);let frame=0,paused=false;document.querySelector('#pause').onclick=()=>{paused=!paused};function paint(){if(!paused)frame++;c.fillStyle='#202a3a';c.fillRect(0,0,1000,500);c.fillStyle='#62758d';c.fillRect(0,420,1000,1);const pose=document.querySelector('#pose').value,aim=document.querySelector('#aim').value;fighters.forEach((f,i)=>{f.x=250+i*500;f.y=FLOOR;f.vx=pose==='walk'?3:0;f.vy=0;f.input=pose==='crouch'?A.down:0;f.move=null;f.stun=0;f.blockstun=pose==='block'?10:0;f.dash=0;if(pose==='walk')f.x+=(frame*3)%120-60;if(pose==='jump'){f.y=FLOOR-Math.sin((frame%90)/90*Math.PI)*65;f.vy=-Math.cos((frame%90)/90*Math.PI)*10;}if(!['idle','walk','jump','crouch','block'].includes(pose)){const m=getMove(f,pose);f.move={id:pose,t:frame%(m.startup+m.active+m.recovery),hit:false,connected:false,wave:0,aim};}c.save();c.translate(0,420-FLOOR);drawHiggsfieldFighter(c,f,frame);c.restore();c.fillStyle='#dce7f5';c.font='16px system-ui';c.fillText(f.id.toUpperCase(),225+i*500,470);});requestAnimationFrame(paint);}paint();</script></body></html>

<!doctype html><html><meta charset="utf-8"><title>Twin spacing review</title><style>body{background:#0a1220;color:#fff;font:16px system-ui}canvas{display:block;width:min(100%,1100px);background:#162033;border:1px solid #779}button,select{font:inherit;margin:8px;padding:8px}p{max-width:900px}</style><h1>Twin spacing review — real standing and walking frames</h1><p>This fixture uses the production formation renderer. Event clips and unused attack frames are omitted to keep the visual review small. The separate spacing smoke check uses the full runtime manifest.</p><label>Team <select id="team"><option value="duo">Sproto Duo</option><option value="sproto2344">Sproto #2344</option></select></label><button id="motion">Walk</button><output id="ready">Loading…</output><canvas id="review" width="1100" height="540"></canvas><script type="module">
import {createState,step,A,FLOOR} from '/src/core.ts';
import {ensurePoseAtlases,drawPoseAtlas} from '/src/poseAtlas.ts';
const fetchOriginal=window.fetch.bind(window);
window.fetch=async(...args)=>{const response=await fetchOriginal(...args);if(String(args[0]).endsWith('/fighters/pose-atlas.json')){const m=await response.json();for(const a of Object.values(m.fighters)){a.frames=a.frames.map((f,i)=>i<=5?f:a.frames[0]);delete a.clips;}return new Response(JSON.stringify(m),{headers:{'content-type':'application/json'}});}return response;};
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),team=document.querySelector('#team'),motion=document.querySelector('#motion'),status=document.querySelector('#ready');let states=[],walking=false;
async function load(){status.textContent='Loading…';await ensurePoseAtlases([team.value]);states=[1,-1].map(face=>{const s=createState(team.value,'dummy','rivet');s.fighters[0].x=640;s.fighters[0].facing=face;s.fighters[1].x=face===1?1200:80;return s;});status.textContent='Ready';}
team.onchange=load;motion.onclick=()=>{walking=!walking;motion.textContent=walking?'Stand':'Walk';};await load();
function render(){c.clearRect(0,0,1100,540);for(let i=0;i<states.length;i++){const s=states[i],f=s.fighters[0],face=i===0?1:-1;if(walking){const direction=Math.floor(s.frame/60)%2===0?face:-face;step(s,[direction===1?A.right:A.left,0]);}f.facing=face;c.fillStyle='#f6dfa6';c.fillText(face===1?'Facing right':'Facing left',i*550+15,30);c.save();c.translate(i*550+275,470);c.scale(1.7,1.7);c.translate(-f.x,-FLOOR);drawPoseAtlas(c,f,s.frame);c.restore();}requestAnimationFrame(render);}render();
</script></html>

# Builds the web game and uploads it as the `web-build` artifact. The hub's
# `npm run fetch:sproto-fighter` downloads the latest successful run of this
# workflow (by name) into its dev server at /play/sproto-fighter/.
name: Web build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The full tree is several GB of authoring art and QA history. Check out
      # only what the build and checks read (see .github/ci-checkout-paths.txt),
      # fetching file contents on demand.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: .github
      - name: Narrow checkout to build and test paths
        run: grep -v '^#' .github/ci-checkout-paths.txt | grep . | git sparse-checkout set --no-cone --stdin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # scripts/sprite-scale-qa.mjs decodes PNGs with Python's Pillow.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Gameplay, art and story checks
        run: node scripts/run-all.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          if-no-files-found: error

  determinism:
    # Online play needs every browser engine to compute the same game. Replay
    # scripted matches in Node, Chromium, Firefox and WebKit and compare state
    # checksums (scripts/determinism-smoke.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src
            scripts
            vendor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/determinism-smoke.mjs
        env:
          DETERMINISM_BROWSERS: chromium,firefox,webkit
